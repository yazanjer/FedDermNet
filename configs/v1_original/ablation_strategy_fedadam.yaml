experiment:
  resume: true
  name: ablation_strategy_fedadam
  dataset: isic2019
  backbone: vgg16_bn
  partition: dirichlet
  alpha: 0.5
  num_clients: 10
  num_rounds: 50
  local_epochs: 2
  fraction_fit: 0.5
  strategy: fedadam
  fedprox_mu: 0.01
  lr: 0.0001
  weight_decay: 0.0001
  batch_size: 32
  early_stop_patience: 5
  seed: 42
  mode: federated
  num_workers: 2

