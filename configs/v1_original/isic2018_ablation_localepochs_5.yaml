experiment:
  resume: true
  name: isic2018_ablation_localepochs_5
  dataset: isic2018
  backbone: vgg16_bn
  partition: dirichlet
  alpha: 0.5
  num_clients: 10
  num_rounds: 50
  local_epochs: 5
  fraction_fit: 0.5
  strategy: fedavg
  lr: 0.0001
  weight_decay: 0.0001
  batch_size: 32
  early_stop_patience: 5
  seed: 42
  mode: federated
  num_workers: 2

