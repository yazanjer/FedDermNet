# ISIC2019 Primary Benchmark — Dirichlet(0.5) label skew, 10 clients (matches manuscript / docs)

experiment:
  resume: true
  name: isic2019_dirichlet
  dataset: isic2019
  backbone: vgg16_bn
  partition: dirichlet
  alpha: 0.5
  num_clients: 10
  num_rounds: 50
  local_epochs: 2
  fraction_fit: 0.5
  strategy: fedavg
  lr: 0.0001
  weight_decay: 0.0001
  batch_size: 32
  early_stop_patience: 5
  seed: 42
  mode: federated
  use_wandb: false
  num_workers: 2

